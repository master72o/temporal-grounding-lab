[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-grounding-lab"
version = "1.0.0"
description = "Multimodal Video & Audio Temporal Event Localization & Timestamp Hallucination Benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Master AI Evaluation Engineer", email = "evaluation@ai-portfolio.dev" }
]
dependencies = [
    "numpy>=1.22.0",
    "pandas>=1.5.0",
    "scipy>=1.9.0",
    "matplotlib>=3.5.0",
    "streamlit>=1.28.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["temporalgrounding*"]
